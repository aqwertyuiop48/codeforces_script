spring:
  application:
    name: spring-ai-demo

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

ai:
  request-timeout: 30s
  default-prompt: how are you
  # Keys come from env vars. A provider with a blank key is reported as "not configured", never crashes the app.
  providers:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com
      completions-path: /v1/chat/completions
      # OpenAI has no permanent free API tier: these are its cheapest models, usable with trial/free credits
      # or the data-sharing programme. Edit freely.
      models:
        - gpt-4o-mini
        - gpt-4.1-nano
        - gpt-5-nano
    gemini:
      api-key: ${GEMINI_API_KEY:}
      # Gemini's OpenAI-compatible endpoint, so the same Spring AI OpenAI client works for both providers.
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      completions-path: /chat/completions
      # Models available on the Gemini API free tier (rate limited).
      models:
        - gemini-3.8-flash
        - gemini-3.7-flash
        - gemini-3.6-flash
        - gemini-3.5-flash
        - gemini-3.5-flash-lite
        - gemini-3.1-pro