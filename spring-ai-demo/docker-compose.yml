# Full local stack: PostgreSQL, MongoDB, Kafka, RabbitMQ + the app as two microservices (api + worker).
#   docker compose up -d                        infrastructure only (run the app yourself: mvn spring-boot:run -Dspring-boot.run.profiles=full)
#   docker compose --profile app up -d --build  infrastructure + api + worker containers
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: ai, POSTGRES_USER: ai, POSTGRES_PASSWORD: ai }
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27017:27017"]

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  # Single-node KRaft Kafka (no ZooKeeper)
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  api:
    build: .
    profiles: [app]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mongo: { condition: service_started }
      kafka: { condition: service_started }
    ports: ["8080:8080"]
    environment: &app-env
      SPRING_PROFILES_ACTIVE: full
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      POSTGRES_URL: r2dbc:postgresql://postgres:5432/ai
      MONGO_URI: mongodb://mongo:27017/ai
      KAFKA_BOOTSTRAP: kafka:19092
      RABBIT_HOST: rabbitmq
      APP_ROLE: api

  worker:
    build: .
    profiles: [app]
    depends_on:
      - api
    environment:
      <<: *app-env
      APP_ROLE: worker
      SERVER_PORT: 8081
