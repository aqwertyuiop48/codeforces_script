name: Spring AI Demo

on:
  # push:
  #   paths:
  #     - 'spring-ai-demo/**'
  #     - '.github/workflows/spring-ai-demo.yml'
  # pull_request:
  #   paths:
  #     - 'spring-ai-demo/**'
  #     - '.github/workflows/spring-ai-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: spring-ai-demo

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run JUnit tests (no API keys needed)
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: spring-ai-demo/target/surefire-reports

  run-app:
    name: Run app and ask "how are you"
    needs: test
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -DskipTests package
      - name: Start the Spring AI app
        run: |
          nohup java -jar target/app.jar > app.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf localhost:8080/actuator/health && break
            sleep 2
          done
      - name: Ask every configured free model
        run: |
          curl -sf localhost:8080/api/models
          echo
          curl -sf --max-time 120 "localhost:8080/api/chat/all?prompt=how%20are%20you"
      - name: Show app log on failure
        if: failure()
        run: cat app.log

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/spring-ai-demo
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t spring-ai-demo:ci .
      - name: Smoke test the container
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          docker run -d --name demo -p 8080:8080 \
            -e OPENAI_API_KEY -e GEMINI_API_KEY spring-ai-demo:ci
          for i in $(seq 1 40); do
            curl -sf localhost:8080/actuator/health && break
            sleep 2
          done
          curl -sf localhost:8080/api/models
          echo
          curl -sf --max-time 120 "localhost:8080/api/chat/all?prompt=how%20are%20you"
      - name: Container logs on failure
        if: failure()
        run: docker logs demo
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag spring-ai-demo:ci $IMAGE:latest
          docker tag spring-ai-demo:ci $IMAGE:${{ github.sha }}
          docker push --all-tags $IMAGE
