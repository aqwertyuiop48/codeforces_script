name: Java CI

on:
  push:
    branches:
      - javac_
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root --password=example --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        env:
          MYSQL_ROOT_PASSWORD: example
          MYSQL_DATABASE: sample_db
          MYSQL_USER: sample_user
          MYSQL_PASSWORD: sample_password

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Setup Ant and Ivy
        run: |
          mkdir -p lib
          curl -L https://repo1.maven.org/maven2/org/apache/ivy/ivy/2.5.2/ivy-2.5.2.jar -o lib/ivy-2.5.2.jar
          # Ant is pre-installed on ubuntu-latest; we just need Ivy in lib/

      - name: Build with Ant
        run: ant clean run

      - name: Build and run with Maven (Root)
        run: |
          mvn clean install
          mvn compile
          mvn exec:java <<EOF
          2
          EOF

      - name: Build and run with Maven (Annotations)
        run: |
          cd annotations_
          mvn clean install
          mvn compile
          mvn exec:java