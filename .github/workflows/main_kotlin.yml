name: Java CI

on:
  push:
    branches:
      - javac_
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root --password=example --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        env:
          MYSQL_ROOT_PASSWORD: example
          MYSQL_DATABASE: sample_db
          MYSQL_USER: sample_user
          MYSQL_PASSWORD: sample_password

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # --------------------
      # Set up Java 21 (Temurin)
      # --------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # --------------------
      # Install Ant + Ivy
      # --------------------
      - name: Install Apache Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant --no-install-recommends
          mkdir -p lib
          curl -L https://repo1.maven.org/maven2/org/apache/ivy/ivy/2.5.2/ivy-2.5.2.jar \
            -o lib/ivy-2.5.2.jar

      # --------------------
      # Verify Java used by Ant
      # --------------------
      - name: Verify Java toolchain
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          ant -diagnostics | grep java.home

      # --------------------
      # Ant build
      # --------------------
      - name: Build with Ant
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          ant clean run

      # --------------------
      # Maven build (root project)
      # --------------------
      - name: Build and run with Maven
        run: |
          mvn clean install
          mvn compile
          mvn exec:java <<EOF
          2
          EOF

      # --------------------
      # Maven build (annotations_)
      # --------------------
      - name: Build Kotlin annotations and run with Maven
        run: |
          cd annotations_
          mvn clean install
          mvn clean compile
          mvn exec:java
