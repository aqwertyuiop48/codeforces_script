name: Build and Run C and C++ Combined Files

on:
  push:
    branches:
      - cpp_
  workflow_dispatch:

jobs:
  build-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 1. GCC & G++ PIPELINES
      # =========================================================

      - name: GCC & G++ on combo.cpp
        run: |
          rm -f *.o runme_*
          gcc -DBUILD_AS_C -x c combo.cpp -o combo_c.o -c
          g++ combo.cpp combo_c.o -o runme_gcc_cpp
          ./runme_gcc_cpp

      - name: G++ only (with -x c) on combo.cpp
        run: |
          rm -f *.o runme_*
          g++ -DBUILD_AS_C -x c combo.cpp -o combo_cpp_c.o -c
          g++ combo.cpp combo_cpp_c.o -o runme_gpp_cpp
          ./runme_gpp_cpp

      - name: GCC & G++ on combo.c
        run: |
          rm -f *.o runme_*
          gcc -DBUILD_AS_C combo.c -o combo_c_from_c.o -c
          g++ -x c++ combo.c combo_c_from_c.o -o runme_gcc_c
          ./runme_gcc_c

      - name: Pure GCC Driver Only (-lstdc++) on combo.cpp & combo.c
        run: |
          rm -f *.o runme_*
          # Pure gcc on combo.cpp
          gcc -DBUILD_AS_C -x c combo.cpp -o pure_gcc_c.o -c
          gcc -x c++ combo.cpp pure_gcc_c.o -lstdc++ -o runme_pure_gcc_cpp
          ./runme_pure_gcc_cpp

          # Pure gcc on combo.c
          gcc -DBUILD_AS_C combo.c -o pure_gcc_c_from_c.o -c
          gcc -x c++ combo.c pure_gcc_c_from_c.o -lstdc++ -o runme_pure_gcc_c
          ./runme_pure_gcc_c

      # =========================================================
      # 2. CLANG & CLANG++ PIPELINES
      # =========================================================

      - name: Clang & Clang++ on combo.cpp
        run: |
          rm -f *.o runme_*
          clang -DBUILD_AS_C -x c combo.cpp -o clang_c.o -c
          clang++ combo.cpp clang_c.o -o runme_clang_cpp
          ./runme_clang_cpp

      - name: Clang++ only (with -x c) on combo.cpp
        run: |
          rm -f *.o runme_*
          clang++ -DBUILD_AS_C -x c combo.cpp -o clangpp_c.o -c
          clang++ combo.cpp clangpp_c.o -o runme_clangpp_cpp
          ./runme_clangpp_cpp

      - name: Pure Clang Driver Only (-lstdc++) on combo.cpp & combo.c
        run: |
          rm -f *.o runme_*
          # Pure clang on combo.cpp
          clang -DBUILD_AS_C -x c combo.cpp -o pure_clang_c.o -c
          clang -x c++ combo.cpp pure_clang_c.o -lstdc++ -o runme_pure_clang_cpp
          ./runme_pure_clang_cpp

          # Pure clang on combo.c
          clang -DBUILD_AS_C combo.c -o pure_clang_c_from_c.o -c
          clang -x c++ combo.c pure_clang_c_from_c.o -lstdc++ -o runme_pure_clang_c
          ./runme_pure_clang_c

      - name: Clang & Clang++ on combo.c
        run: |
          rm -f *.o runme_*
          clang -DBUILD_AS_C combo.c -o clang_c_from_c.o -c
          clang++ -x c++ combo.c clang_c_from_c.o -o runme_clang_c
          ./runme_clang_c