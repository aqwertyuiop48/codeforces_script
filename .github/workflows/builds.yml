name: Build and Run C and C++ Combined File 

on:
  push:
    branches:
      - cpp_
  workflow_dispatch:

jobs:
  build-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build C and C++ part
        run: |
          gcc -DBUILD_AS_C -xc combo.cpp -o combo_c.o -c
          echo "C part compiled successfully."
          g++ combo.cpp combo_c.o -o runme
          echo "C++ part compiled successfully."

      - name: Run executable
        run: |
          ./runme

      - name: Build C and C++ part (via G++)
        run: |
          g++ -DBUILD_AS_C -x c combo.cpp -o combo_cpp_c.o -c
          echo "C part compiled successfully with g++ (-x c)."
          g++ combo.cpp combo_cpp_c.o -o runme_gpp
          echo "C++ part linked successfully with g++-built object."

      - name: Run executable (G++ build)
        run: |
          ./runme_gpp
