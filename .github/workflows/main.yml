name: Run the Node.js Script 

on:
  push:
    branches:
      - main_
  repository_dispatch:
    types:
      - trigger-codeforces-script # This listens for the custom dispatch event
  workflow_dispatch:


jobs:
  build-ubuntu:
    runs-on: ubuntu-latest

    steps:
      # - name: Run Bitbucket script
      #   run: |
      #     git clone https://sreebitbucket19@bitbucket.org/sreebitbucket19/first_repo.git
      #     cd first_repo
      #     ls -la
      #     python hello.py 

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '6.x'  # Specify the .NET version you want

      - name: Install dotnet-script
        run: |
          dotnet tool install -g dotnet-script --version 1.5.0
          export PATH="$PATH:/home/runner/.dotnet/tools"


      - name: Install Kotlin
        run: |
          curl -s https://get.sdkman.io | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install kotlin

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
      
      - name: Install C++ Compiler
        run: sudo apt-get install g++

      - name: Run script
        run: npm run pystart

  build-macos:
      # 'macos-15' is the reliable mid-range choice in 2026. 
      # Use 'macos-26' if you want the absolute latest cutting-edge.
      runs-on: macos-15 
  
      steps:
        - name: Checkout code
          uses: actions/checkout@v4 # Always use v4+ in 2026
  
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
  
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20' # Bumped to 20 for 2026 compatibility
  
        - name: Install dependencies
          run: npm install
  
        - name: Install Kotlin via SDKMAN
          # We MUST use Zsh because macOS runners in 2026 still ship 
          # with the ancient Bash 3.2, which SDKMAN rejects.
          shell: zsh {0} 
          run: |
            # 1. Install SDKMAN (rcupdate=false prevents it from hanging)
            curl -s "https://get.sdkman.io?rcupdate=false" | zsh
            
            # 2. Source the init script
            export SDKMAN_DIR="$HOME/.sdkman"
            [[ -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]] && source "$SDKMAN_DIR/bin/sdkman-init.sh"
            
            # 3. Install Kotlin (Non-interactive)
            sdk install kotlin < /dev/null
            
            # 4. Make Kotlin available for future steps
            echo "$HOME/.sdkman/candidates/kotlin/current/bin" >> $GITHUB_PATH
            
            # 5. Run your script immediately
            npm run pystart
            npm run pystartmac
        
