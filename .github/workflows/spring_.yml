name: Build and Test Spring MVC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        # 1. Update Cache: specific path to pom.xml for caching to work
        cache-dependency-path: 'spring-app/pom.xml' 

    - name: Build and Test with Maven
      run: mvn clean package
      # 2. Update Execution: Run this command inside the subfolder
      working-directory: ./spring-app

    - name: Upload WAR file
      uses: actions/upload-artifact@v3
      with:
        name: spring-mvc-war
        # 3. Update Path: Look for the war file inside the subfolder's target
        path: spring-app/target/*.war