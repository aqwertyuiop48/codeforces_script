name: Build and Test Spring MVC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        # 1. Update Cache Path: Point to the actual location of pom.xml
        cache-dependency-path: 'spring-app/spring-hello-world/pom.xml'

    - name: Build and Test with Maven
      run: mvn clean package
      # 2. Update Working Directory: Run commands INSIDE the folder containing pom.xml
      working-directory: ./spring-app/spring-hello-world

    - name: Upload WAR file
      uses: actions/upload-artifact@v3
      with:
        name: spring-mvc-war
        # 3. Update Artifact Path: Look inside the nested target folder
        path: spring-app/spring-hello-world/target/*.war